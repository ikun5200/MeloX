name: Build unsigned IPA / 构建未签名 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - qq-migration
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build iOS IPA / 构建 iOS IPA
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode / 选择 Xcode
        run: |
          set -euo pipefail

          XCODE_APP=""
          for candidate in /Applications/Xcode_27.1.app /Applications/Xcode_27.1.0.app /Applications/Xcode.app; do
            if [[ -d "${candidate}" ]]; then
              XCODE_APP="${candidate}"
              break
            fi
          done

          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::No supported Xcode installation found / 找不到可用的 Xcode"
            exit 1
          fi

          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IFS=. read -r SDK_MAJOR SDK_MINOR _ <<< "${SDK_VERSION}"
          if (( SDK_MAJOR < 27 || (SDK_MAJOR == 27 && ${SDK_MINOR:-0} < 1) )); then
            echo "::error::iOS 27.1 SDK or later is required; found ${SDK_VERSION} / 需要 iOS 27.1 或更高版本 SDK，当前为 ${SDK_VERSION}"
            exit 1
          fi

      - name: Run backend checks / 运行后端检查
        run: python3 -I Tools/Tests/test_qq_backend.py

      - name: Build unsigned IPA / 构建未签名 IPA
        env:
          RELEASE_NOTES_CURRENT_REF: ${{ github.sha }}
        run: bash build_ios_unsigned.sh

      - name: Upload IPA artifact / 上传 IPA 产物
        uses: actions/upload-artifact@v7
        with:
          name: MeloX-iOS-unsigned-${{ github.run_number }}
          path: build/MeloX-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest IPA release / 发布最新 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="ios-latest"
          TITLE="MeloX iOS 开发版（最新构建）"
          NOTES="$(mktemp)"

          {
            echo "MeloX QQ 音乐迁移版，未签名 IPA。"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Build: \`${GITHUB_RUN_NUMBER}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Built at: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "\`MeloX-iOS-unsigned.ipa\` 未签名，安装前需要自行签名。"
            if [[ -f build/ReleaseNotes.md ]]; then
              echo
              echo "## 更新内容 / What's New"
              echo
              cat build/ReleaseNotes.md
            fi
          } > "${NOTES}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file "${NOTES}" \
              --prerelease
            gh release upload "${TAG}" \
              "build/MeloX-iOS-unsigned.ipa#MeloX-iOS-unsigned.ipa" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file "${NOTES}" \
              --prerelease \
              "build/MeloX-iOS-unsigned.ipa#MeloX-iOS-unsigned.ipa"
          fi

      - name: Prepare release body / 准备发版说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          {
            echo "## English"
            echo
            echo "This MeloX iOS + Apple Watch build was produced automatically by GitHub Actions."
            echo
            echo "- \`MeloX-iOS-unsigned.ipa\` is unsigned and must be signed before installation."
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Build: \`${GITHUB_RUN_NUMBER}\`"
            echo
            echo "## 简体中文"
            echo
            echo "该 MeloX iOS + Apple Watch 版本由 GitHub Actions 自动构建。"
            echo
            echo "- \`MeloX-iOS-unsigned.ipa\` 未签名，需要自行签名后安装。"
            echo "- Commit：\`${GITHUB_SHA}\`"
            echo "- 构建编号：\`${GITHUB_RUN_NUMBER}\`"
            echo
            echo "## What's New / 更新内容"
            echo
            cat build/ReleaseNotes.md
          } > build/release-body.md

      - name: Publish GitHub Release / 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "build/MeloX-iOS-unsigned.ipa#MeloX-iOS-unsigned.ipa" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MeloX iOS + Apple Watch ${GITHUB_REF_NAME}" \
              --notes-file build/release-body.md \
              "build/MeloX-iOS-unsigned.ipa#MeloX-iOS-unsigned.ipa"
          fi
